# DeepSeek Web provider for omp.
#
# Copy this block into ~/.omp/agent/models.yml, merging it under the existing
# top-level `providers:` key.
#
# Start the proxy first (`bun run start`), load the DeepSeek Token Bridge
# extension from `extension/`, and sign in at https://chat.deepseek.com.
# The extension writes the real token to ~/.omp/agent/deepseek-web-token; the
# proxy reads it at startup and on every POST /login/token.
#
# `local` is a dummy credential so omp selects the provider. The proxy ignores
# it: when a stored token is present, that token is used for DeepSeek.
#
# Verify with:
#   omp models find deepseek-web
#   omp --model deepseek-web/deepseek-web

providers:
  deepseek-web:
    baseUrl: http://127.0.0.1:8787/v1
    api: openai-completions
    apiKey: local
    authHeader: true
    models:
      - id: deepseek-web
        name: DeepSeek Web (free)
        reasoning: false
        input: [text]
        supportsTools: true
        contextWindow: 128000
        maxTokens: 8192
        compat:
          supportsToolChoice: false
          supportsStrictMode: false
          supportsDeveloperRole: false
